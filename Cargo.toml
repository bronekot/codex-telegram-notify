[package]
name = "codex-telegram-notify"
version = "0.1.0"
edition = "2021"
description = "Send Codex Stop hook notifications to Telegram"
license = "MIT"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "time"] }
toml = "0.9"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
